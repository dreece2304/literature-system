[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetics-toolkit"
version = "0.1.0"
description = "Portable analysis toolkit for vapor-phase thin-film etch / dry-development kinetics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.4"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["kinetics_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
