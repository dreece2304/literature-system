[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "literature-core"
version = "0.1.0"
description = "Core database models and utilities for literature management"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["literature_core"]
