# LLM Model Specifications and Configurations
# This file defines model-specific parameters, system prompts, and constraints

# =============================================================================
# MODEL REGISTRY
# =============================================================================
models:
  # Writer Agent Model (High Quality)
  qwen:7b-q5_K_M:
    name: "Qwen 7B (5-bit quantized)"
    family: "qwen"
    size: "7B"
    quantization: "q5_K_M"
    vram_requirement: 5.5  # GB
    context_window: 8192
    use_cases: ["writing", "reading", "creative"]
    strengths:
      - "Excellent instruction following"
      - "Strong reasoning capabilities"
      - "Good multilingual support"
      - "Academic writing proficiency"

  # Triager Agent Model (Fast, Efficient)
  qwen:7b-q4_K_M:
    name: "Qwen 7B (4-bit quantized)"
    family: "qwen"
    size: "7B"
    quantization: "q4_K_M"
    vram_requirement: 4.5  # GB
    context_window: 8192
    use_cases: ["triage", "scoring", "classification"]
    strengths:
      - "Fast inference"
      - "Good for structured output"
      - "Deterministic scoring"
      - "Lower memory footprint"

# =============================================================================
# AGENT CONFIGURATIONS
# =============================================================================
agents:
  # Writing Assistant Agent
  writer:
    model: "qwen:7b-q5_K_M"
    temperature: 0.7
    top_p: 0.9
    top_k: 40
    repeat_penalty: 1.1
    max_tokens: 2048

    system_prompt: |
      You are an expert academic writing assistant specializing in scientific literature.

      Your role is to:
      1. Suggest relevant citations from the user's paper collection
      2. Provide context-aware recommendations based on manuscript content
      3. Generate citation-backed text expansions for outlines
      4. Maintain academic tone and precision

      Guidelines:
      - Only cite papers from the provided context (no hallucinated references)
      - Use [AuthorYear] citation format unless specified otherwise
      - Explain WHY each paper is relevant
      - Prioritize high-quality, peer-reviewed sources
      - Consider paper publication year and field relevance

      Output format: Structured JSON with citations and explanations.

    features:
      citation_suggestion: true
      outline_expansion: true
      context_detection: true
      bibliography_generation: true

    constraints:
      max_citations_per_request: 10
      min_relevance_score: 0.7
      require_abstracts: true

  # Paper Triage Agent
  triager:
    model: "qwen:7b-q4_K_M"
    temperature: 0.3  # More deterministic
    top_p: 0.85
    top_k: 30
    repeat_penalty: 1.0
    max_tokens: 512

    system_prompt: |
      You are an expert paper triage system for academic researchers.

      Your task is to score papers on a 0-10 scale based on relevance to user interests.

      Scoring criteria:
      - 9-10: Essential reading, directly addresses core research questions
      - 7-8: Highly relevant, significant contributions to the field
      - 5-6: Moderately relevant, useful background or methodology
      - 3-4: Tangentially related, potential peripheral value
      - 1-2: Minimal relevance, different field or approach
      - 0: Not relevant

      Consider:
      1. Topic alignment with user research interests
      2. Methodological relevance
      3. Citation impact and venue prestige
      4. Novelty and contribution
      5. Recency (prefer recent unless classic paper)

      Output format: JSON with integer score (0-10) and brief justification.

    features:
      batch_scoring: true
      priority_queue: true
      interest_profiling: true

    constraints:
      max_batch_size: 50
      score_justification_required: true
      output_format: "json"

  # Reading Assistant Agent (Q&A)
  reader:
    model: "qwen:7b-q5_K_M"
    temperature: 0.1  # Very deterministic
    top_p: 0.9
    top_k: 20
    repeat_penalty: 1.05
    max_tokens: 1024

    system_prompt: |
      You are an expert research assistant providing accurate answers about academic papers.

      Your role is to:
      1. Answer questions using ONLY information from provided paper contexts
      2. Cite specific papers when making claims
      3. Acknowledge limitations and uncertainty
      4. Synthesize information across multiple papers when relevant

      Rules:
      - NEVER hallucinate information not in the context
      - If unsure, say "I don't have enough information"
      - Cite paper titles and authors for all claims
      - Use clear, precise academic language
      - Highlight conflicting findings when present

      Output format: Natural language answer with inline citations.

    features:
      multi_paper_synthesis: true
      citation_tracking: true
      uncertainty_acknowledgment: true
      follow_up_questions: true

    constraints:
      max_context_papers: 20
      require_citations: true
      max_answer_length: 1000

# =============================================================================
# PROMPT TEMPLATES
# =============================================================================
prompt_templates:
  # Citation suggestion prompt
  cite_suggestion:
    user_template: |
      Manuscript context:
      Section: {section}
      Current text: {text}

      Relevant papers from collection:
      {papers}

      Task: Suggest the top {n} most relevant citations for this text.
      Include brief explanation for each suggestion.

  # Paper scoring prompt
  score_paper:
    user_template: |
      Research interests:
      {interests}

      Paper to score:
      Title: {title}
      Authors: {authors}
      Abstract: {abstract}
      Venue: {venue}
      Year: {year}

      Task: Provide a relevance score (0-10) and justification.

  # Question answering prompt
  answer_question:
    user_template: |
      Question: {question}

      Relevant papers:
      {papers}

      Task: Answer the question using ONLY information from these papers.
      Cite specific papers for all claims.

# =============================================================================
# GPU MEMORY MANAGEMENT
# =============================================================================
gpu_management:
  # RTX 4070 8GB constraints
  max_vram: 8.0  # GB
  safety_margin: 0.5  # Reserve 0.5GB for overhead

  # Model loading strategy
  serialization:
    enabled: true
    keep_alive: 60  # seconds
    unload_on_idle: true

  # Per-model VRAM budgets
  vram_budgets:
    "qwen:7b-q5_K_M": 5.5
    "qwen:7b-q4_K_M": 4.5

  # Monitoring
  monitoring:
    enabled: true
    check_interval: 10  # seconds
    alert_threshold: 0.9  # 90% usage warning

# =============================================================================
# PERFORMANCE TARGETS
# =============================================================================
performance:
  writer:
    target_latency: 2.0  # seconds
    max_latency: 5.0
    throughput: 30  # requests/minute

  triager:
    target_latency: 0.5  # seconds
    max_latency: 2.0
    throughput: 120  # requests/minute (batch mode)

  reader:
    target_latency: 3.0  # seconds
    max_latency: 10.0
    throughput: 20  # requests/minute

# =============================================================================
# FALLBACK STRATEGIES
# =============================================================================
fallback:
  # If primary model unavailable
  model_fallback:
    enabled: true
    chain:
      - "qwen:7b-q5_K_M"
      - "qwen:7b-q4_K_M"

  # If GPU unavailable
  cpu_fallback:
    enabled: false  # Qwen requires GPU
    warning_message: "GPU required for Qwen models"

  # If Ollama unavailable
  service_fallback:
    enabled: false  # No alternative LLM provider
    retry_attempts: 3
    retry_delay: 5  # seconds

# =============================================================================
# CACHING STRATEGIES
# =============================================================================
caching:
  # Response caching
  responses:
    enabled: true
    ttl: 3600  # seconds
    max_size: 1000  # entries

  # Embedding caching (for context papers)
  embeddings:
    enabled: true
    ttl: 86400  # 24 hours

  # Cache keys
  key_components:
    - "model_name"
    - "temperature"
    - "prompt_hash"
