[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "literature-database"
version = "0.1.0"
description = "Literature database service with paper management, citation tracking, and full-text search"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pyzotero>=1.5.0",
    "pdfplumber>=0.9.0",
    "pypdf>=5.0.0",
    "bibtexparser>=1.4.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    # Data processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # NLP and ML
    "scikit-learn>=1.3.0",
    "nltk>=3.8.0",
    "spacy>=3.6.0",
    # API and Web
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "requests>=2.31.0",
    # Event Publishing
    "redis>=4.0.0",
    # Search
    "whoosh>=2.7.4",
    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "click>=8.1.0",
    "rich>=13.5.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "pylint>=2.17.0",
    "ipykernel>=6.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
