# Writer Agent Prompt Templates

system_prompt: |
  You are an expert academic writing assistant specializing in scientific literature.

  Your role is to:
  1. Suggest relevant citations from the user's paper collection
  2. Provide context-aware recommendations based on manuscript content
  3. Generate citation-backed text expansions for outlines
  4. Maintain academic tone and precision

  Guidelines:
  - Only cite papers from the provided context (no hallucinated references)
  - Use [AuthorYear] citation format unless specified otherwise
  - Explain WHY each paper is relevant
  - Prioritize high-quality, peer-reviewed sources
  - Consider paper publication year and field relevance

  Output format: Structured JSON with citations and explanations.

# Template: Citation Suggestion
citation_suggestion:
  template: |
    ## Manuscript Context
    Section: {section}
    Current paragraph:
    ```
    {text}
    ```

    ## Research Question/Claim
    {claim}

    ## Available Papers
    {papers}

    ## Task
    Suggest the top {n} most relevant citations to support this text.

    For each suggestion, provide:
    1. Paper identifier (from list above)
    2. Relevance score (0.0-1.0)
    3. Specific contribution (what does this paper add?)
    4. Suggested integration (how to incorporate the citation)

    Output as JSON array.

  output_schema: |
    {
      "suggestions": [
        {
          "paper_id": "string",
          "title": "string",
          "authors": "string",
          "year": "integer",
          "relevance_score": "float",
          "contribution": "string",
          "integration_suggestion": "string",
          "quote_suggestion": "string (optional)"
        }
      ]
    }

# Template: Outline Expansion
outline_expansion:
  template: |
    ## Section Outline
    Section: {section}
    Subsections:
    {outline}

    ## Writing Guidelines
    - Tone: {tone}
    - Target length: {target_length} words
    - Citation style: {citation_style}

    ## Available Papers
    {papers}

    ## Task
    Expand this outline into a well-structured draft with appropriate citations.

    Requirements:
    - Start each paragraph with a topic sentence
    - Support claims with citations from provided papers
    - Maintain logical flow between paragraphs
    - Use transition phrases appropriately
    - Include at least {min_citations} citations

    Output as structured text with inline citations.

  output_schema: |
    {
      "section": "string",
      "paragraphs": [
        {
          "topic": "string",
          "content": "string",
          "citations": ["string"]
        }
      ],
      "word_count": "integer",
      "citation_count": "integer"
    }

# Template: Related Work Generation
related_work:
  template: |
    ## Research Topic
    {topic}

    ## Key Contributions of Current Work
    {contributions}

    ## Available Papers (Already in Collection)
    {papers}

    ## Task
    Generate a "Related Work" section that:
    1. Groups papers by theme/approach
    2. Contrasts different approaches
    3. Identifies gaps that your work addresses
    4. Positions your work in the literature

    Output as structured paragraphs with citations.

  output_schema: |
    {
      "themes": [
        {
          "name": "string",
          "description": "string",
          "papers": ["string"],
          "paragraph": "string"
        }
      ],
      "gaps": "string",
      "positioning": "string"
    }

# Template: Citation Context Enhancement
enhance_citation:
  template: |
    ## Current Citation Usage
    ```
    {current_text}
    ```

    ## Paper Details
    Title: {title}
    Authors: {authors}
    Abstract: {abstract}
    Key Findings: {findings}

    ## Task
    The citation is currently underutilized. Suggest how to:
    1. Integrate more specific findings from this paper
    2. Strengthen the argument with details
    3. Improve citation placement or phrasing

    Provide before/after examples.

  output_schema: |
    {
      "current": "string",
      "improved": "string",
      "specific_findings_added": ["string"],
      "explanation": "string"
    }

# Template: Missing Citations Detection
detect_missing_citations:
  template: |
    ## Manuscript Text
    ```
    {text}
    ```

    ## Available Papers
    {papers}

    ## Task
    Identify claims or statements that should be cited but currently lack citations.

    For each uncited claim:
    1. Quote the specific text
    2. Explain why it needs citation
    3. Suggest appropriate papers from the collection
    4. Provide citation placement

  output_schema: |
    {
      "uncited_claims": [
        {
          "text": "string",
          "reason": "string",
          "suggested_papers": [
            {
              "paper_id": "string",
              "title": "string",
              "justification": "string"
            }
          ],
          "suggested_revision": "string"
        }
      ]
    }

# Template: Bibliography Generation
generate_bibliography:
  template: |
    ## Cited Papers
    {papers}

    ## Citation Style
    {style}

    ## Task
    Generate a properly formatted bibliography/references section.

    Requirements:
    - Follow {style} formatting exactly
    - Sort according to style requirements
    - Include all required fields (DOI, URL, etc.)
    - Check for consistency

    Output as formatted text.

  output_schema: |
    {
      "references": [
        {
          "paper_id": "string",
          "formatted_citation": "string",
          "bibtex_key": "string"
        }
      ],
      "full_bibliography": "string"
    }
