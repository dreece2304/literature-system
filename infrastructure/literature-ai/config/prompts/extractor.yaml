# Extractor Agent Prompts
# Used for AI-powered content extraction from academic papers

system_prompt: |
  You are an expert scientific literature analyst specializing in materials science,
  particularly thin film deposition, atomic layer deposition (ALD), and molecular layer deposition (MLD).

  Your expertise includes:
  - MLD/ALD growth mechanisms and parameters
  - Film characterization techniques (FTIR, XPS, ellipsometry, AFM, SEM)
  - EUV lithography and resist materials
  - Reaction mechanisms and DFT calculations
  - Stability and degradation of thin films

  Your task is to extract structured information from academic papers with precision and accuracy.
  Always respond with valid JSON matching the requested schema.
  Only include information that is explicitly stated in the paper - do not infer or speculate.

# Basic extraction - summary, key findings, paper type
basic_extraction:
  description: "Extract basic structured content from a paper"
  template: |
    Analyze this paper and extract the following information:

    PAPER METADATA:
    Title: {title}
    Authors: {authors}
    Year: {year}
    Abstract: {abstract}

    FULL TEXT (if available):
    {full_text}

    Extract and return JSON with this exact structure:
    {{
        "paper_type": "<type>",
        "topics": ["topic1", "topic2", ...],
        "one_sentence_summary": "<summary>",
        "key_findings": [
            {{
                "finding_id": "01",
                "statement": "<clear statement>",
                "evidence": "<how established>",
                "topics": ["relevant", "topics"]
            }}
        ],
        "methodology_summary": "<methods description>"
    }}

    Guidelines:
    - paper_type: Choose from: research_article, review, conference, book_chapter, thesis, preprint
    - topics: Select relevant topics from this list:
      * mld_growth, ald_growth (deposition techniques)
      * alucone, zincone, titanicone, hafnicone (MLD film types)
      * stability, degradation, air_stability, thermal_stability
      * spectroscopy, ftir, xps, ellipsometry, afm, sem
      * mechanism, reaction_pathway, dft_calculations
      * euv_lithography, resist_performance, resist_background
      * precursors, tma, deg, ethylene_glycol
    - key_findings: Extract 3-10 significant findings with evidence
    - Be precise and factual, only include what's in the paper

# Comprehensive MLD growth extraction
comprehensive_mld:
  description: "Extract detailed MLD/ALD growth parameters"
  template: |
    Extract MLD/ALD growth parameters from this paper:

    Title: {title}
    Abstract: {abstract}

    Text:
    {full_text}

    Return JSON with this structure:
    {{
        "mld_growth": {{
            "materials": {{
                "metal_precursor": {{
                    "name": "<full name>",
                    "abbreviation": "<TMA, DEZ, etc.>",
                    "formula": "<chemical formula>",
                    "metal": "<Al, Zn, Ti, etc.>"
                }},
                "organic_precursor": {{
                    "name": "<full name>",
                    "abbreviation": "<EG, HQ, etc.>",
                    "formula": "<chemical formula>",
                    "structure_type": "<diol, triol, etc.>"
                }},
                "film_type": "<alucone, zincone, etc.>"
            }},
            "deposition_conditions": {{
                "temperature_C": <number or null>,
                "pressure_mTorr": <number or null>,
                "pulse_sequence": {{
                    "metal_pulse_s": <number>,
                    "metal_purge_s": <number>,
                    "organic_pulse_s": <number>,
                    "organic_purge_s": <number>
                }}
            }},
            "growth_rates": [
                {{
                    "GPC_nm": <number>,
                    "organic_linker": "<name>",
                    "measurement_method": "<ellipsometry, XRR, etc.>",
                    "notes": "<any conditions>"
                }}
            ],
            "film_properties": {{
                "thickness_range_nm": [<min>, <max>],
                "refractive_index": <number or null>,
                "density_g_cm3": <number or null>
            }},
            "mechanism_insights": "<any discussion of growth mechanism>"
        }}
    }}

    Only include data explicitly stated in the paper. Use null for unknown values.

# Spectroscopy data extraction
comprehensive_spectro:
  description: "Extract spectroscopy characterization data"
  template: |
    Extract spectroscopy data from this paper:

    Title: {title}
    Text: {full_text}

    Return JSON:
    {{
        "spectroscopy": {{
            "ftir_peaks": [
                {{
                    "wavenumber_cm-1": <number>,
                    "assignment": "<chemical bond/group>",
                    "intensity": "strong|medium|weak",
                    "notes": "<any observations>"
                }}
            ],
            "xps_binding_energies": [
                {{
                    "element": "<C, O, Al, etc.>",
                    "orbital": "<1s, 2p, etc.>",
                    "binding_energy_eV": <number>,
                    "species": "<chemical species>",
                    "notes": "<any observations>"
                }}
            ],
            "ellipsometry": {{
                "refractive_index": <number or null>,
                "wavelength_nm": <number or null>,
                "k_extinction": <number or null>
            }},
            "other_characterization": {{
                "afm": "<surface morphology observations>",
                "sem": "<imaging observations>",
                "aes": "<depth profile observations>"
            }}
        }}
    }}

    Include all spectroscopy data found in the paper.

# Mechanism extraction
comprehensive_mechanism:
  description: "Extract reaction mechanism and computational data"
  template: |
    Extract reaction mechanism data from this paper:

    Title: {title}
    Text: {full_text}

    Return JSON:
    {{
        "mechanism": {{
            "reactions": [
                {{
                    "description": "<what happens>",
                    "equation": "<chemical equation if given>",
                    "temperature_range_C": "<range or single value>",
                    "rate_limiting": <true or false>
                }}
            ],
            "activation_energies": [
                {{
                    "process": "<which reaction>",
                    "Ea_eV": <number>,
                    "Ea_kJ_mol": <number>,
                    "method": "<how determined>"
                }}
            ],
            "dft_calculations": [
                {{
                    "method": "<B3LYP, etc.>",
                    "basis_set": "<if mentioned>",
                    "energy_delta_eV": <number>,
                    "description": "<what was calculated>"
                }}
            ],
            "pathway_description": "<overall mechanism description>"
        }}
    }}

    Focus on quantitative data where available.

# Relevance assessment
relevance_assessment:
  description: "Assess paper relevance to a research project"
  template: |
    Assess the relevance of this paper to the research project.

    PAPER:
    Title: {title}
    Abstract: {abstract}
    Key Findings: {key_findings}

    PROJECT CONTEXT:
    Project Name: {project_name}
    Project Description: {project_context}

    Evaluate and return JSON:
    {{
        "overall_relevance": "<level>",
        "relevance_summary": "<2-3 sentence explanation>",
        "primary_use": "<section>"
    }}

    Relevance levels:
    - CRITICAL: Essential reference that directly addresses core research questions.
                Must be cited. Provides key data, methods, or theoretical foundation.
    - HIGH: Important supporting reference. Provides significant data, methods,
            or context that strengthens the manuscript.
    - MEDIUM: Useful background or comparison. Adds value but not essential.
    - LOW: Tangentially related. Could be cited but not necessary.
    - NONE: Not relevant to this project's scope.

    Primary use options:
    - introduction: Background, motivation, literature review
    - methods: Methodology reference, technique validation
    - results: Data comparison, validation of findings
    - discussion: Interpretation, comparison with other work
    - none: Not applicable

# Stability data extraction
comprehensive_stability:
  description: "Extract film stability and degradation data"
  template: |
    Extract stability and degradation data from this paper:

    Title: {title}
    Text: {full_text}

    Return JSON:
    {{
        "stability": {{
            "air_stability": {{
                "exposure_conditions": "<ambient, humid, etc.>",
                "duration": "<time period>",
                "observations": "<what changed>",
                "quantitative": "<any measured values>"
            }},
            "thermal_stability": {{
                "temperature_range_C": "<range tested>",
                "atmosphere": "<air, N2, vacuum, etc.>",
                "observations": "<what changed>",
                "degradation_onset_C": <number or null>
            }},
            "developer_compatibility": {{
                "developer_type": "<TMAH, etc.>",
                "etch_rate_nm_s": <number or null>,
                "observations": "<behavior>"
            }},
            "uv_stability": {{
                "exposure_type": "<EUV, DUV, etc.>",
                "dose_mJ_cm2": <number or null>,
                "observations": "<effects>"
            }},
            "kinetics": {{
                "rate_constant": "<if measured>",
                "activation_energy_eV": <number or null>,
                "mechanism": "<degradation mechanism>"
            }}
        }}
    }}

    Only include stability data that was actually tested and reported.
