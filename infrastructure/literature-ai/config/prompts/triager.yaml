# Triager Agent Prompt Templates

system_prompt: |
  You are an expert paper triage system for academic researchers.

  Your task is to score papers on a 0-10 scale based on relevance to user interests.

  Scoring criteria:
  - 9-10: Essential reading, directly addresses core research questions
  - 7-8: Highly relevant, significant contributions to the field
  - 5-6: Moderately relevant, useful background or methodology
  - 3-4: Tangentially related, potential peripheral value
  - 1-2: Minimal relevance, different field or approach
  - 0: Not relevant

  Consider:
  1. Topic alignment with user research interests
  2. Methodological relevance
  3. Citation impact and venue prestige
  4. Novelty and contribution
  5. Recency (prefer recent unless classic paper)

  Output format: JSON with integer score (0-10) and brief justification.

# Template: Single Paper Scoring
score_paper:
  template: |
    ## User Research Profile
    Research interests: {interests}
    Current projects: {projects}
    Preferred methods: {methods}

    ## Paper to Score
    Title: {title}
    Authors: {authors}
    Year: {year}
    Venue: {venue}
    Citations: {citation_count}

    Abstract:
    ```
    {abstract}
    ```

    ## Task
    Provide a relevance score (0-10) with justification.

    Consider:
    - Direct topic alignment
    - Methodological fit
    - Venue quality
    - Recency vs. classic status
    - Potential applications to user's work

  output_schema: |
    {
      "paper_id": "string",
      "score": "integer (0-10)",
      "justification": "string",
      "dimensions": {
        "topic_alignment": "float (0-1)",
        "methodological_relevance": "float (0-1)",
        "venue_prestige": "float (0-1)",
        "novelty": "float (0-1)",
        "applicability": "float (0-1)"
      },
      "key_takeaways": ["string"],
      "action": "enum(must_read, should_read, skim, skip)"
    }

# Template: Batch Scoring
score_batch:
  template: |
    ## User Research Profile
    Research interests: {interests}
    Current projects: {projects}

    ## Papers to Score
    {papers}

    ## Task
    Score each paper (0-10) and provide brief justification.
    Rank papers by relevance score.

    Be efficient: focus on title, abstract, and venue for quick assessment.

  output_schema: |
    {
      "scores": [
        {
          "paper_id": "string",
          "score": "integer",
          "brief_reason": "string",
          "priority": "enum(high, medium, low)"
        }
      ],
      "ranked_ids": ["string"],
      "summary": {
        "high_priority_count": "integer",
        "medium_priority_count": "integer",
        "low_priority_count": "integer"
      }
    }

# Template: Paper Comparison
compare_papers:
  template: |
    ## User Research Goal
    {goal}

    ## Papers to Compare
    Paper A: {paper_a}
    Paper B: {paper_b}

    ## Task
    Compare these papers for relevance to the research goal.

    Provide:
    1. Which paper is more relevant and why
    2. Unique contributions of each
    3. Potential complementary value
    4. Reading priority recommendation

  output_schema: |
    {
      "more_relevant": "string (paper_a or paper_b)",
      "score_a": "integer",
      "score_b": "integer",
      "comparison": {
        "paper_a_strengths": ["string"],
        "paper_b_strengths": ["string"],
        "complementary_value": "string"
      },
      "recommendation": "string"
    }

# Template: Reading Priority Queue
create_reading_queue:
  template: |
    ## User Context
    Available reading time: {time_budget} hours this week
    Current project stage: {project_stage}
    Immediate needs: {immediate_needs}

    ## Paper Collection
    {papers}

    ## Task
    Create a prioritized reading queue.

    Organize papers into:
    1. Must Read This Week (urgent, high-impact)
    2. Should Read Soon (important but not urgent)
    3. Optional Reading (good to know)
    4. Archive for Later (low priority)

  output_schema: |
    {
      "must_read": [
        {
          "paper_id": "string",
          "estimated_time": "integer (minutes)",
          "reason": "string"
        }
      ],
      "should_read": [...],
      "optional": [...],
      "archive": [...],
      "total_must_read_time": "integer (minutes)"
    }

# Template: Paper Clustering by Theme
cluster_papers:
  template: |
    ## Papers
    {papers}

    ## Task
    Cluster these papers by research theme/approach.

    For each cluster:
    1. Identify the common theme
    2. List papers in cluster
    3. Identify the most representative/important paper
    4. Suggest reading order within cluster

  output_schema: |
    {
      "clusters": [
        {
          "theme": "string",
          "description": "string",
          "papers": ["string"],
          "representative_paper": "string",
          "reading_order": ["string"],
          "average_score": "float"
        }
      ]
    }

# Template: Research Gap Identification
identify_gaps:
  template: |
    ## User Research Interests
    {interests}

    ## Highly Scored Papers
    {top_papers}

    ## Lower Scored Papers
    {low_papers}

    ## Task
    Identify potential research gaps or underexplored areas.

    Look for:
    1. Topics mentioned but not deeply explored
    2. Contradictory findings needing resolution
    3. Methodological limitations across papers
    4. Application areas not yet addressed

  output_schema: |
    {
      "gaps": [
        {
          "gap_type": "enum(topic, methodology, application)",
          "description": "string",
          "supporting_evidence": ["string"],
          "potential_impact": "string",
          "difficulty": "enum(low, medium, high)"
        }
      ],
      "priority_gaps": ["string"]
    }

# Template: Venue/Author Importance
assess_importance:
  template: |
    ## Paper Details
    Title: {title}
    Venue: {venue}
    Authors: {authors}
    Citation count: {citations}
    Year: {year}

    ## User Field
    {field}

    ## Task
    Assess the importance indicators of this paper.

    Consider:
    - Is this a top-tier venue in the field?
    - Are authors prominent researchers?
    - Is citation count appropriate for paper age?
    - Is this a landmark/seminal paper?

  output_schema: |
    {
      "venue_tier": "enum(tier1, tier2, tier3, workshop, arxiv)",
      "author_prominence": "enum(high, medium, low)",
      "citation_impact": "enum(highly_cited, well_cited, moderate, low)",
      "paper_type": "enum(seminal, landmark, standard, incremental)",
      "importance_score": "float (0-1)",
      "should_prioritize": "boolean"
    }
