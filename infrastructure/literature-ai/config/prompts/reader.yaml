# Reader Agent Prompt Templates (RAG-powered Q&A)

system_prompt: |
  You are an expert research assistant providing accurate answers about academic papers.

  Your role is to:
  1. Answer questions using ONLY information from provided paper contexts
  2. Cite specific papers when making claims
  3. Acknowledge limitations and uncertainty
  4. Synthesize information across multiple papers when relevant

  Rules:
  - NEVER hallucinate information not in the context
  - If unsure, say "I don't have enough information"
  - Cite paper titles and authors for all claims
  - Use clear, precise academic language
  - Highlight conflicting findings when present

  Output format: Natural language answer with inline citations.

# Template: Question Answering
answer_question:
  template: |
    ## Question
    {question}

    ## Context from Papers
    {papers_context}

    ## Task
    Answer the question using ONLY information from the provided papers.

    Requirements:
    - Cite papers inline using [Author et al., Year] format
    - If multiple papers address the question, synthesize their findings
    - Note any contradictions or disagreements
    - If information is insufficient, clearly state this
    - Provide confidence level (high/medium/low)

  output_schema: |
    {
      "answer": "string",
      "citations": [
        {
          "paper_id": "string",
          "title": "string",
          "authors": "string",
          "year": "integer",
          "relevant_quote": "string"
        }
      ],
      "confidence": "enum(high, medium, low)",
      "limitations": "string (optional)",
      "follow_up_questions": ["string"]
    }

# Template: Paper Summarization
summarize_paper:
  template: |
    ## Paper
    Title: {title}
    Authors: {authors}
    Year: {year}

    Full text:
    ```
    {full_text}
    ```

    ## Task
    Provide a comprehensive summary including:
    1. Research question/problem
    2. Methodology
    3. Key findings
    4. Contributions
    5. Limitations
    6. Future work suggestions

  output_schema: |
    {
      "research_question": "string",
      "methodology": "string",
      "key_findings": ["string"],
      "contributions": ["string"],
      "limitations": ["string"],
      "future_work": ["string"],
      "one_sentence_summary": "string"
    }

# Template: Methodology Extraction
extract_methodology:
  template: |
    ## Research Question
    {question}

    ## Papers
    {papers}

    ## Task
    Extract and compare the methodologies used across these papers.

    For each paper:
    1. Identify the research method (experimental, analytical, etc.)
    2. Key techniques or algorithms
    3. Datasets or evaluation metrics
    4. Strengths and limitations of the approach

  output_schema: |
    {
      "methodologies": [
        {
          "paper_id": "string",
          "method_type": "string",
          "techniques": ["string"],
          "datasets": ["string"],
          "metrics": ["string"],
          "strengths": ["string"],
          "limitations": ["string"]
        }
      ],
      "comparison": "string",
      "recommended_approach": "string"
    }

# Template: Find Evidence
find_evidence:
  template: |
    ## Claim to Verify
    {claim}

    ## Papers
    {papers}

    ## Task
    Find evidence supporting or refuting this claim.

    Provide:
    1. Supporting evidence with citations
    2. Contradicting evidence with citations
    3. Overall assessment (supported/refuted/mixed/insufficient)

  output_schema: |
    {
      "claim": "string",
      "supporting_evidence": [
        {
          "paper_id": "string",
          "quote": "string",
          "strength": "enum(strong, moderate, weak)"
        }
      ],
      "contradicting_evidence": [...],
      "assessment": "enum(supported, refuted, mixed, insufficient)",
      "confidence": "enum(high, medium, low)",
      "explanation": "string"
    }

# Template: Compare Approaches
compare_approaches:
  template: |
    ## Research Topic
    {topic}

    ## Papers with Different Approaches
    {papers}

    ## Task
    Compare and contrast the different approaches taken by these papers.

    Analyze:
    1. What are the distinct approaches?
    2. What are the trade-offs of each?
    3. Which approach is best for which scenarios?
    4. Are approaches complementary or competing?

  output_schema: |
    {
      "approaches": [
        {
          "name": "string",
          "papers": ["string"],
          "description": "string",
          "advantages": ["string"],
          "disadvantages": ["string"],
          "best_for": "string"
        }
      ],
      "comparison_matrix": "string",
      "recommendation": "string"
    }

# Template: Find Related Papers
find_related:
  template: |
    ## Reference Paper
    Title: {title}
    Abstract: {abstract}

    ## Available Papers in Collection
    {papers}

    ## Task
    Identify papers in the collection that are most related to the reference paper.

    For each related paper:
    1. Explain the relationship (cites, extends, contradicts, etc.)
    2. Assess similarity strength
    3. Note any key differences

  output_schema: |
    {
      "related_papers": [
        {
          "paper_id": "string",
          "title": "string",
          "relationship_type": "enum(cites, cited_by, extends, similar_method, similar_problem, contradicts)",
          "similarity_score": "float (0-1)",
          "explanation": "string",
          "key_differences": "string"
        }
      ],
      "clusters": [
        {
          "theme": "string",
          "papers": ["string"]
        }
      ]
    }

# Template: Timeline/Evolution Analysis
analyze_evolution:
  template: |
    ## Topic
    {topic}

    ## Papers (Chronologically Ordered)
    {papers}

    ## Task
    Analyze how this research topic has evolved over time.

    Identify:
    1. Early foundational work
    2. Key breakthroughs or paradigm shifts
    3. Current state-of-the-art
    4. Emerging trends

  output_schema: |
    {
      "timeline": [
        {
          "period": "string (e.g., '2015-2017')",
          "phase": "string (e.g., 'Foundation')",
          "key_papers": ["string"],
          "characteristics": "string"
        }
      ],
      "breakthroughs": [
        {
          "paper_id": "string",
          "year": "integer",
          "impact": "string"
        }
      ],
      "current_sota": "string",
      "emerging_trends": ["string"]
    }

# Template: Extract Definitions
extract_definitions:
  template: |
    ## Term or Concept
    {term}

    ## Papers
    {papers}

    ## Task
    Extract how this term/concept is defined across different papers.

    Note:
    - Direct definitions (quote exactly)
    - Implicit definitions (inferred from usage)
    - Variations or disagreements
    - Evolution of definition over time

  output_schema: |
    {
      "term": "string",
      "definitions": [
        {
          "paper_id": "string",
          "definition": "string",
          "type": "enum(explicit, implicit)",
          "quote": "string (if explicit)"
        }
      ],
      "consensus_definition": "string",
      "variations": ["string"],
      "notes": "string"
    }

# Template: Limitations and Gaps
identify_limitations:
  template: |
    ## Papers
    {papers}

    ## Task
    Identify stated limitations and potential research gaps.

    For each paper:
    1. What limitations do the authors acknowledge?
    2. What limitations are implicit but not stated?
    3. What future work do they suggest?
    4. What gaps remain unaddressed?

  output_schema: |
    {
      "paper_limitations": [
        {
          "paper_id": "string",
          "stated_limitations": ["string"],
          "implicit_limitations": ["string"],
          "suggested_future_work": ["string"]
        }
      ],
      "common_limitations": ["string"],
      "research_gaps": [
        {
          "gap": "string",
          "papers_affected": ["string"],
          "potential_impact": "string"
        }
      ]
    }

# Template: Multi-Paper Synthesis
synthesize_findings:
  template: |
    ## Research Question
    {question}

    ## Papers (All address this question)
    {papers}

    ## Task
    Synthesize findings across all papers into a coherent answer.

    Structure:
    1. Consensus findings (agreed by most/all papers)
    2. Contradictory findings (disagreements)
    3. Complementary insights (different aspects)
    4. Overall conclusion

  output_schema: |
    {
      "consensus": {
        "findings": ["string"],
        "supporting_papers": ["string"]
      },
      "contradictions": [
        {
          "point": "string",
          "position_a": {
            "claim": "string",
            "papers": ["string"]
          },
          "position_b": {
            "claim": "string",
            "papers": ["string"]
          },
          "resolution": "string (if possible)"
        }
      ],
      "complementary_insights": ["string"],
      "synthesis": "string",
      "confidence": "enum(high, medium, low)"
    }
