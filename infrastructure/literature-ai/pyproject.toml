[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litai"
version = "0.1.0"
description = "LLM-powered services for academic research and literature management"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "dreece23"}
]
keywords = ["literature", "research", "ai", "llm", "papers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # LLM & AI Stack
    "ollama>=0.1.7",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",

    # Vector Database
    "chromadb>=0.4.22",

    # Embeddings
    "sentence-transformers>=2.3.0",
    "transformers>=4.36.0",

    # API Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Task Queue
    "celery>=5.3.4",
    "redis>=5.0.1",

    # Utilities
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "tiktoken>=0.5.2",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",

    # PDF Processing
    "pypdf>=3.17.0",
    "arxiv>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "black>=23.12.1",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "ipykernel>=6.28.0",
]

[project.scripts]
litai-api = "src.api.main:run"
litai-enrich = "scripts.enrich_papers:main"
litai-sync = "scripts.sync_papers:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "config", "scripts"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/config",
    "/scripts",
    "/tests",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | \.pytest_cache
    | htmlcov
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["src", "config"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
