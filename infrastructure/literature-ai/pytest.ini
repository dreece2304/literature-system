[pytest]
# Pytest configuration for literature-ai service

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov

# Markers
markers =
    unit: Unit tests (fast, mocked dependencies)
    integration: Integration tests (slower, real services)
    slow: Slow tests (LLM calls, large data)
    requires_ollama: Tests that require Ollama running
    requires_redis: Tests that require Redis running
    requires_gpu: Tests that require GPU
    asyncio: Async tests using pytest-asyncio

# Asyncio configuration
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
