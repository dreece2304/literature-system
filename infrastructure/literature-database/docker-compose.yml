# Docker Compose configuration for Literature Database Service
# Supports both SQLite and PostgreSQL configurations

version: '3.8'

services:
  # Literature Database Service
  literature-database:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: literature-database:dev
    container_name: literature-database-dev
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # Service Configuration
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: 8001
      SERVICE_NAME: literature-database
      
      # Database Configuration (SQLite by default)
      DATABASE_URL: sqlite:///data/metadata/literature.db
      
      # Redis Configuration
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      
      # Zotero Configuration
      ZOTERO_WINDOWS_PATH: /mnt/c/Users/dreec/Zotero
      ZOTERO_LIBRARY_TYPE: user
      
      # Logging Configuration
      LOG_LEVEL: DEBUG
      LOG_FILE: logs/litdb.log
      
      # Development Settings
      DEBUG: "true"
      RELOAD: "true"
      
      # CORS Origins
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:8000", "http://localhost:8080"]'
    
    volumes:
      # Data persistence
      - ./data:/app/data
      - ./logs:/app/logs
      
      # Mount shared types from monorepo (adjust path as needed)
      - ../../shared:/app/shared:ro
      
      # Development hot-reload (comment out for production)
      - ./src:/app/src
      - ./config:/app/config
      - ./.env:/app/.env
    
    depends_on:
      - redis
    
    networks:
      - literature-net
      - monorepo-net
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for event publishing
  redis:
    image: redis:7-alpine
    container_name: literature-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - literature-net
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL (alternative to SQLite for production)
  postgres:
    image: postgres:15-alpine
    container_name: literature-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: literature_db
      POSTGRES_USER: literature_user
      POSTGRES_PASSWORD: literature_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - literature-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U literature_user -d literature_db"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - postgres  # Only start when specifically requested

  # Database migration service (for PostgreSQL)
  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: literature-migration
    environment:
      DATABASE_URL: postgresql://literature_user:literature_pass@postgres:5432/literature_db
    volumes:
      - ../../shared:/app/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - literature-net
    command: >
      python -c "
      from src.models import Base; 
      from src.database import get_engine, load_config; 
      engine = get_engine({'database': {'type': 'postgresql', 'url': 'postgresql://literature_user:literature_pass@postgres:5432/literature_db'}}); 
      Base.metadata.create_all(bind=engine); 
      print('Database tables created successfully')
      "
    profiles:
      - postgres
    restart: "no"

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local

networks:
  # Internal network for this service stack
  literature-net:
    driver: bridge
  
  # External network for monorepo services
  monorepo-net:
    external: true
    name: research-monorepo-network