# Docker Compose override for different environments
# This file provides environment-specific configurations

version: '3.8'

services:
  # PostgreSQL Configuration Override
  literature-database-postgres:
    extends:
      service: literature-database
    container_name: literature-database-postgres
    environment:
      # Override to use PostgreSQL
      DATABASE_URL: postgresql://literature_user:literature_pass@postgres:5432/literature_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy